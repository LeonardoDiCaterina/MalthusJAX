[suite]
name = "h2_ablation_lhs"
mode = "lhs"
output_dir = "results/h2_ablation"
num_seeds = 100
aggregation_level = "summary_only"

[grid]
functions = ["sphere", "rosenbrock", "rastrigin"]
dims_min = 2
dims_max = 100
pops_min = 10
pops_max = 1000
gens_min = 10
gens_max = 1000
num_samples = 30

[analysis]
reference_pipeline = "mjx_baseline"

[pipelines.mjx_baseline]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0

[pipelines.mjx_ablate_mutation]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "gaussian:mutation_strength=1.0"
elitism = 0

[pipelines.mjx_ablate_crossover]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "uniform_real:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0

[pipelines.mjx_ablate_sel_tournament]
backend = "malthusjax"
selection = "tournament:num_selections={pop_size},tournament_size=3"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0

[pipelines.mjx_ablate_sel_elite]
backend = "malthusjax"
selection = "elite_pool:num_selections={pop_size},elite_k={elite_k},sampling_method=choice"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
