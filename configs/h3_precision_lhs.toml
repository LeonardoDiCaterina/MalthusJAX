[suite]
name = "h3_precision_lhs"
mode = "lhs"
output_dir = "results/h3_precision_lhs"
num_seeds = 100
num_samples = 20
aggregation_level = "summary_only"

[grid]
functions = ["lunacek_bi_rastrigin", "schwefel", "gallagher_21_hi"]
dims = [10, 50, 100]
pops = [256, 1024]
gens = [200]

[analysis]
reference_pipeline = "mjx_f32"

[pipelines.mjx_f32]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size},elite_k={elite_k}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "float32"

[pipelines.mjx_bf16]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size},elite_k={elite_k}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "bfloat16"

[pipelines.mjx_f16]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size},elite_k={elite_k}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "float16"
