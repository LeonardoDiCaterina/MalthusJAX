[suite]
name = "h1_parity_lhs"
mode = "lhs"
output_dir = "results/h1_parity_lhs"
num_seeds = 100
aggregation_level = "summary_only"

[grid]
functions = ["sphere", "rosenbrock", "rastrigin"]
dims_min = 2
dims_max = 100
pops_min = 10
pops_max = 1000
gens_min = 10
gens_max = 1000
num_samples = 30

[analysis]
reference_pipeline = "evosax_baseline"

[pipelines.evosax_baseline]
backend = "evosax"
evosax_strategy = "SimpleGA"

[pipelines.malthusjax_wrapper]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
