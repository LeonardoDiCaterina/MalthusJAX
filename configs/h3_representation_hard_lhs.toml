[suite]
name = "h3_representation_hard_lhs"
mode = "lhs"
output_dir = "results/h3_representation_hard"
num_seeds = 30
aggregation_level = "summary_only"

[grid]
functions = ["lunacek", "schwefel", "gallagher_21_hi"]
dims_min = 2
dims_max = 100
pops_min = 10
pops_max = 1000
gens_min = 10
gens_max = 1000
num_samples = 30

[analysis]
reference_pipeline = "mjx_f32"

[pipelines.mjx_f32]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "float32"

[pipelines.mjx_bf16]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "bfloat16"

[pipelines.mjx_f16]
backend = "malthusjax"
selection = "evosax_mimic_selection:num_selections={pop_size}"
crossover = "evosax_uniform_crossover:crossover_rate=0.3"
mutation = "evosax_gaussian:mutation_strength=1.0"
elitism = 0
dtype = "float16"
