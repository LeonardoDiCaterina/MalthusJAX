# experiment.toml
[experiment]
name       = "sphere_test"
output_dir = "results/sphere"

[experiment.shared]
fitness       = "sphere:dim=10"
genome_type   = "real"
genome_length = 10
bounds        = [-5.0, 5.0]
pop_size      = 64
generations   = 100
seeds         = [42, 43, 44]

[pipelines.ga]
engine_type = "ga"
selection   = "tournament:num_selections=64,tournament_size=3"
crossover   = "simulated_binary:eta=15"
mutation    = "gaussian:mutation_rate=0.1"