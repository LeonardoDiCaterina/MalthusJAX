[experiment]
name = "rastrigin_multimodal"
description = "Benchmark algorithms on highly multimodal Rastrigin landscape"
output_dir = "results/rastrigin_multimodal"

[experiment.shared]
fitness = "rastrigin:dim=20"
pop_size = 150
generations = 300
seeds = [42, 43, 44, 45, 46]
genome_type = "real"
genome_length = 20
bounds = [-5.12, 5.12]
maximize = false
elitism = 3

# Strong selection pressure needed for multimodal landscape
# Larger tournament sizes to avoid getting stuck in local optima
[experiment.multimodal_selection]
selection_pressure = "high"
tournament_size = 5

# Pipeline 1: High Exploitation (Small Tournament)
# Risk: premature convergence to local optimum
[pipelines.tournament_2_sbx_polynomial]
selection = "tournament:num_selections=50,tournament_size=2"
crossover = "simulated_binary:eta=20"
mutation = "polynomial:mutation_rate=0.1,eta=20"
mutation_schedule = "constant"
description = "Low selection pressure (T=2), polynomial mutation constant"

# Pipeline 2: Medium Pressure (Standard Tournament)
# Balance between exploration and exploitation
[pipelines.tournament_3_sbx_gaussian]
selection = "tournament:num_selections=50,tournament_size=3"
crossover = "simulated_binary:eta=20"
mutation = "gaussian:mutation_rate=0.2,mutation_strength=0.15"
mutation_schedule = "linear_decay"
description = "Standard tournament (T=3), gaussian with decay"

# Pipeline 3: High Exploration (Larger Tournament)
# Better for escaping local optima
[pipelines.tournament_5_uniform_polynomial]
selection = "tournament:num_selections=50,tournament_size=5"
crossover = "uniform_real"
mutation = "polynomial:mutation_rate=0.1,eta=20"
mutation_schedule = "linear_decay"
description = "High selection pressure (T=5), polynomial with decay"

# Pipeline 4: Roulette Selection (Fitness-Proportional)
# Smoother pressure curve, less risk of stagnation
[pipelines.roulette_blend_polynomial]
selection = "roulette:num_selections=50"
crossover = "blend:alpha=0.5"
mutation = "polynomial:mutation_rate=0.1,eta=20"
mutation_schedule = "cosine_anneal"
description = "Roulette selection, blend + polynomial + cosine schedule"

# Pipeline 5: Elite Pool Selection
# Maintain diversity via elite pool, high exploitation
[pipelines.elite_pool_sbx_aggressive]
selection = "elite_pool:num_selections=50,elite_k=15"
crossover = "simulated_binary:eta=30"
mutation = "gaussian:mutation_rate=0.3,mutation_strength=0.2"
mutation_schedule = "exponential_decay"
description = "Elite pool (k=15), aggressive mutation with exponential decay"

# Pipeline 6: Adaptive Mutation Rate
# Higher mutation early for exploration, lower later for exploitation
[pipelines.tournament_4_adaptive_mutation]
selection = "tournament:num_selections=50,tournament_size=4"
crossover = "blend:alpha=0.3"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.2"
mutation_schedule = "exponential_decay"
description = "Tournament T=4, blend α=0.3, exponential mutation decay"

# Pipeline 7: Two-Parent Dominant
# Heavy reliance on crossover for exploration
[pipelines.tournament_3_sbx_light_mutation]
selection = "tournament:num_selections=50,tournament_size=3"
crossover = "simulated_binary:eta=40"
mutation = "polynomial:mutation_rate=0.05,eta=30"
mutation_schedule = "linear_decay"
description = "Light mutation (5%), strong SBX (η=40) for exploration"
