[experiment]
name = "scaling_benchmark"
description = "Benchmark algorithm scalability across problem dimensions and instances"
output_dir = "results/scaling_benchmark"

[experiment.shared]
# All pipelines share these defaults
pop_size = 100
generations = 250
seeds = [42, 43, 44, 45, 46]
maximize = false
elitism = 2

# --- Data: Multiple Problem Scales ---

[data.sphere_dim_5]
source = "synthetic"
fitness_type = "sphere"
dim = 5
random_seed = 42

[data.sphere_dim_10]
source = "synthetic"
fitness_type = "sphere"
dim = 10
random_seed = 42

[data.sphere_dim_25]
source = "synthetic"
fitness_type = "sphere"
dim = 25
random_seed = 42

[data.sphere_dim_50]
source = "synthetic"
fitness_type = "sphere"
dim = 50
random_seed = 42

[data.rastrigin_dim_5]
source = "synthetic"
fitness_type = "rastrigin"
dim = 5
random_seed = 42

[data.rastrigin_dim_10]
source = "synthetic"
fitness_type = "rastrigin"
dim = 10
random_seed = 42

[data.rastrigin_dim_20]
source = "synthetic"
fitness_type = "rastrigin"
dim = 20
random_seed = 42

# --- Sphere Function: Dimension Scaling ---

# Baseline algorithm: Uniform + Gaussian
[pipelines.sphere_dim5_baseline]
fitness = "sphere:dim=5"
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 5
description = "Sphere dim=5: baseline uniform+gaussian"

[pipelines.sphere_dim10_baseline]
fitness = "sphere:dim=10"
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 10
description = "Sphere dim=10: baseline uniform+gaussian"

[pipelines.sphere_dim25_baseline]
fitness = "sphere:dim=25"
pop_size = 150
selection = "tournament:num_selections=40,tournament_size=3"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 25
description = "Sphere dim=25: scaled population to 150"

[pipelines.sphere_dim50_baseline]
fitness = "sphere:dim=50"
pop_size = 200
generations = 300
selection = "tournament:num_selections=50,tournament_size=3"
crossover = "blend:alpha=0.5"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.05"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 50
description = "Sphere dim=50: larger pop, blend crossover"

# --- Rastrigin Function: Difficult Scaling ---

# Rastrigin is highly multimodal: need stronger search
[pipelines.rastrigin_dim5_baseline]
fitness = "rastrigin:dim=5"
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "blend:alpha=0.5"
mutation = "polynomial:mutation_rate=0.1,eta=20"
bounds = [-5.12, 5.12]
genome_type = "real"
genome_length = 5
description = "Rastrigin dim=5: baseline with SBX-like operators"

[pipelines.rastrigin_dim10_baseline]
fitness = "rastrigin:dim=10"
pop_size = 120
selection = "tournament:num_selections=40,tournament_size=3"
crossover = "simulated_binary:eta=20"
mutation = "polynomial:mutation_rate=0.1,eta=20"
bounds = [-5.12, 5.12]
genome_type = "real"
genome_length = 10
description = "Rastrigin dim=10: SBX + polynomial"

[pipelines.rastrigin_dim20_baseline]
fitness = "rastrigin:dim=20"
pop_size = 150
generations = 350
selection = "tournament:num_selections=50,tournament_size=4"
crossover = "simulated_binary:eta=20"
mutation = "polynomial:mutation_rate=0.1,eta=20"
bounds = [-5.12, 5.12]
genome_type = "real"
genome_length = 20
description = "Rastrigin dim=20: higher tournament pressure"

# --- Cross-Sample Consistency Check ---

# Two runs of same algorithm, different seeds
[pipelines.sphere_dim10_seed42]
fitness = "sphere:dim=10"
seeds = [42]
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 10
description = "Sphere dim=10: seed=42 only (variance analysis)"

[pipelines.sphere_dim10_seed43]
fitness = "sphere:dim=10"
seeds = [43]
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 10
description = "Sphere dim=10: seed=43 only (variance analysis)"

# --- Algorithm Comparison at Fixed Dimension ---

# Dimension 10: compare operator combinations
[pipelines.sphere_dim10_uniform_poly]
fitness = "sphere:dim=10"
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "uniform_real"
mutation = "polynomial:mutation_rate=0.1,eta=20"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 10
description = "Sphere dim=10: uniform + polynomial (cross-operator test)"

[pipelines.sphere_dim10_blend_poly]
fitness = "sphere:dim=10"
selection = "tournament:num_selections=25,tournament_size=3"
crossover = "blend:alpha=0.5"
mutation = "polynomial:mutation_rate=0.1,eta=20"
bounds = [-5.0, 5.0]
genome_type = "real"
genome_length = 10
description = "Sphere dim=10: blend + polynomial (cross-operator test)"
