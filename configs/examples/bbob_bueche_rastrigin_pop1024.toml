# BBOB Backend Comparison Experiment - Bueche Rastrigin Function (Population Size 1024)
# Tests bueche_rastrigin function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Bueche Rastrigin (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on bueche_rastrigin function"
output_dir = "results/bbob_bueche_rastrigin_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.bueche_rastrigin_malthusjax_default]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Bueche Rastrigin function with MalthusJAX default operators (pop=1024)"

[pipelines.bueche_rastrigin_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Bueche Rastrigin function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.bueche_rastrigin_malthusjax_roulette]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Bueche Rastrigin function with MalthusJAX roulette selection (pop=1024)"

[pipelines.bueche_rastrigin_malthusjax_tournament]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Bueche Rastrigin function with MalthusJAX tournament selection (pop=1024)"

[pipelines.bueche_rastrigin_evosax_simplega]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Bueche Rastrigin function with EvoSAX SimpleGA (pop=1024)"

[pipelines.bueche_rastrigin_evosax_differential_evolution]
fitness = "bbob:fn_name=bueche_rastrigin,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Bueche Rastrigin function with EvoSAX DifferentialEvolution (pop=1024)"
