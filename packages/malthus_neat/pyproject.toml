[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "malthus-neat"
version = "0.1.0"
description = "JAX-native Neuroevolution of Augmenting Topologies (NEAT) framework with Scikit-Learn estimator APIs and Quality-Diversity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Leonardo Di Caterina" }
]
keywords = [
    "neuroevolution",
    "neat",
    "hyperneat",
    "jax",
    "evolutionary-computation",
    "reinforcement-learning",
    "scikit-learn",
    "quality-diversity",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.0",
    "numpy>=1.24.0",
    "flax>=0.7.0",
    "chex>=0.1.7",
    "tensorneat>=0.1.0",
    "malthusjax>=0.2.0",
]

[project.scripts]
mneat = "malthus_neat.cli:main"

[project.entry-points."malthusjax.plugins"]
neat = "malthus_neat"

[project.entry-points."malthusjax.commands"]
neat = "malthus_neat.cli:main"

[project.optional-dependencies]
learn = [
    "scikit-learn>=1.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "networkx>=3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.0.0",
]
all = [
    "malthus-neat[learn,viz,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/malthus_neat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
