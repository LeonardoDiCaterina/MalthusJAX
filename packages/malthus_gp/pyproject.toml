[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "malthus-gp"
version = "0.1.0"
description = "JAX-native Genetic Programming framework with Cartesian GP, neutral drift, and Scikit-Learn estimator APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Leonardo Di Caterina" }
]
keywords = [
    "genetic-programming",
    "cartesian-genetic-programming",
    "cgp",
    "jax",
    "evolutionary-computation",
    "symbolic-regression",
    "scikit-learn",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.0",
    "numpy>=1.24.0",
    "flax>=0.7.0",
    "chex>=0.1.7",
    "malthusjax>=0.2.0",
]

[project.scripts]
mgp = "malthus_gp.cli:main"

[project.entry-points."malthusjax.plugins"]
gp = "malthus_gp"

[project.entry-points."malthusjax.commands"]
gp = "malthus_gp.cli:main"

[project.optional-dependencies]
learn = [
    "scikit-learn>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.0.0",
]
all = [
    "malthus-gp[learn,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/malthus_gp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
