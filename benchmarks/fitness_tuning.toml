# Fitness Tuning Configuration for MalthusJAX
# This config searches for optimal hyperparameters to maximize solution quality

[experiment]
name = "MalthusJAX_Fitness_Tuning"
output_dir = "results/fitness_tuning"

[grid]
algorithms = ["Standard_GA"]  # Focus on one algorithm
tasks = ["sphere", "rosenbrock"]  # Test on representative problems
dimensions = [50, 100]  # Higher dimensions where current params struggle
pop_sizes = [128, 1024]  # Representative population sizes
seeds = [42]  # Single seed for tuning (use multiple for final validation)
generations = 500  # More generations to ensure convergence
repeats = 10  # Fewer repeats for faster tuning

# Hyperparameter sweep grid
# Each parameter lists values to try
[hyperparam_sweep]
mutation_rate = [0.8, 0.9, 1.0]  # Per-gene mutation probability
sigma = [0.5, 0.8, 1.0]  # Mutation strength
elite_ratio = [0.5]  # Elite selection ratio
crossover_rate = [0.5, 0.7, 0.8, 0.9, 1.0]  # Crossover rate

# Total combinations: 3 × 3 × 1 × 5 = 45 hyperparameter configs
# × 2 tasks × 2 dimensions × 2 pop sizes = 360 total runs
# At ~10 repeats each = ~3,600 evaluations
# Estimated time: ~2-4 hours on H100
