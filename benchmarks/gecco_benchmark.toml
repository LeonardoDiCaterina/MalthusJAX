[experiment]
name = "GECCO_2026_Submission_Benchmarks"
output_dir = "results/gecco_run"

[grid]
# Match the key registered in registry.py
algorithms = ["Standard_GA"] 

# BBOB Function names (strings)
tasks = ["sphere", "rastrigin"]

# Problem Dimensions
dimensions = [10, 50]

# THE KILL SHOT SCALING
# 128: Interactive
# 1024: Batch
# 16384: Hyperscale (Power of 2 for TPU padding efficiency)
pop_sizes = [128, 1024, 16384]

seeds = [42, 43, 44]
generations = 2000

# Overrides for the Registry defaults
[grid.hyperparams]
mutation_rate = 0.05
crossover_rate = 0.6
sigma = 0.1
elite_ratio = 0.1