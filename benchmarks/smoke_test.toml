[experiment]
name = "GECCO_Smoke_Test_Alignment"
output_dir = "results/smoke_test"

[grid]
algorithms = ["Standard_GA", "Standard_GA_Ablation"]

# 1. Minimal Task List (Just one easy, one hard)
tasks = ["sphere", "rosenbrock"]

# 2. Smallest Dimension
dimensions = [10]

# 3. Critical Alignment Check
# We test the "Warp Boundary" (128 vs 129) to ensure no crash
pop_sizes = [128, 129]

# 4. Both Kernel Paths
unroll_factors = [1]

# 5. Speed Settings (Instant execution)
repeats = 1
generations = 100
seeds = [42]

[grid.hyperparams]
mutation_rate = 0.05
crossover_rate = 0.6
sigma = 0.1
elite_ratio = 0.1