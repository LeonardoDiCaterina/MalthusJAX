# Quick Fitness Tuning - Fast iteration for testing
# Smaller grid for rapid prototyping

[experiment]
name = "MalthusJAX_Quick_Fitness_Test"
output_dir = "results/fitness_tuning/quick"

[grid]
algorithms = ["Standard_GA"]
tasks = ["sphere"]  # Single task for speed
dimensions = [50]  # Single dimension
pop_sizes = [128]  # Single population size
seeds = [42]
generations = 200  # Shorter runs
repeats = 5  # Fewer repeats

# Focused hyperparameter sweep
# Test the most promising ranges
[hyperparam_sweep]
mutation_rate = [0.1, 0.3, 0.5]  # 3 values
sigma = [0.3, 0.5, 0.8]  # 3 values
elite_ratio = [0.05, 0.1]  # 2 values
crossover_rate = [0.6]  # Keep fixed

# Total: 3 × 3 × 2 × 1 = 18 configs
# Fast runtime for testing (~5-10 minutes)
