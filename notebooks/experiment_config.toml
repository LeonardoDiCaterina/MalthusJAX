[pipelines.attractive_sector_malthusjax_default]
fitness = "bbob:fn_name=attractive_sector,dim=10,seed=42"
elitism = 0
selection = "elite_pool:num_selections=512,elite_k=50"
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.1,mutation_strength=0.05"

[pipelines.attractive_sector_mjx_evosax_exact]
