# All 24 BBOB functions, extended exact-match comparison
[experiment]
name = "bbob_all_functions_match_simplega_extended_100_seeds"
output_dir = "results/bbob_allfunctions_match_simplega_extended_100seeds_20260427"
description = "Compare MalthusJAX default, exact Evosax operator wrappers, and native Evosax engines across all 24 BBOB functions."

[experiment.shared]
engine_type = "ga"
genome_type = "real"
genome_length = 10
bounds = [-5.0, 5.0]
pop_size = 1024
generations = 500
seeds = [
