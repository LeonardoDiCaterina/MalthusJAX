# BBOB Backend Comparison Experiment - Attractive Sector Function (Population Size 1024)
# Tests attractive_sector function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Attractive Sector (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on attractive_sector function"
output_dir = "results/bbob_attractive_sector_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.attractive_sector_malthusjax_default]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Attractive Sector function with MalthusJAX default operators (pop=1024)"

[pipelines.attractive_sector_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Attractive Sector function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.attractive_sector_malthusjax_roulette]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "roulette:num_selections=512,temperature=1.0"
description = "Attractive Sector function with MalthusJAX roulette selection (pop=1024)"

[pipelines.attractive_sector_malthusjax_tournament]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "tournament:num_selections=512,tournament_size=3"
description = "Attractive Sector function with MalthusJAX tournament selection (pop=1024)"

[pipelines.attractive_sector_evosax_simplega]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Attractive Sector function with EvoSAX SimpleGA (pop=1024)"

[pipelines.attractive_sector_evosax_differential_evolution]
fitness = "bbob:fn_name=attractive_sector,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Attractive Sector function with EvoSAX DifferentialEvolution (pop=1024)"
