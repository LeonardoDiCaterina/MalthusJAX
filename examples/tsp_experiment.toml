[experiment]
name = "tsp_demo"
output_dir = "results/tsp_demo"

[experiment.shared]
fitness = "tsp:data_id=berlin52_synthetic"
genome = "real:dim=52,bounds=(0,1)"
pop_size = 100
generations = 50
seeds = [1, 2, 3]

[data.berlin52_synthetic]
source = "synthetic"
generator = "tsp"
num_cities = 52
random_seed = 42

[pipelines.ga_baseline]
selection = "tournament:tournament_size=3"
crossover = "blend:alpha=0.5"
mutation = "gaussian:mutation_rate=0.1"

[pipelines.ga_blend]
selection = "tournament:tournament_size=3"
crossover = "blend:alpha=0.8"
mutation = "gaussian:mutation_rate=0.1"
