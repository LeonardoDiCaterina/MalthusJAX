# BBOB Backend Comparison Experiment - Population Size 1025
# Tests all 24 BBOB functions across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1025

[experiment]
name = "BBOB Backend Comparison (pop=1025)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on 24 BBOB functions"
output_dir = "results/bbob_comparison_pop1025"

[experiment.shared]
# Genome configuration
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]

# Shared experiment parameters
generations = 500
seeds = 100

# Part 1: Separable functions
[pipelines.sphere_malthusjax_default]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Sphere function with MalthusJAX default operators (pop=1025)"

[pipelines.sphere_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Sphere function with MalthusJAX + EvoSAX operators (pop=1025)"

[pipelines.sphere_malthusjax_roulette]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "roulette:num_selections=512,temperature=1.0"
description = "Sphere function with MalthusJAX roulette selection (pop=1025)"

[pipelines.sphere_malthusjax_tournament]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "tournament:num_selections=512,tournament_size=3"
description = "Sphere function with MalthusJAX tournament selection (pop=1025)"

[pipelines.sphere_evosax_simplega]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Sphere function with EvoSAX SimpleGA (pop=1025)"

[pipelines.sphere_evosax_differential_evolution]
fitness = "bbob:fn_name=sphere,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Sphere function with EvoSAX DifferentialEvolution (pop=1025)"

