# BBOB Backend Comparison Experiment - Gallagher 21-HI Function (Population Size 1024)
# Tests gallagher_21_hi function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Gallagher 21-HI (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on gallagher_21_hi function"
output_dir = "results/bbob_gallagher_21_hi_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.gallagher_21_hi_malthusjax_default]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Gallagher 21-HI function with MalthusJAX default operators (pop=1024)"

[pipelines.gallagher_21_hi_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Gallagher 21-HI function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.gallagher_21_hi_malthusjax_roulette]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "roulette:num_selections=512,temperature=1.0"
description = "Gallagher 21-HI function with MalthusJAX roulette selection (pop=1024)"

[pipelines.gallagher_21_hi_malthusjax_tournament]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "tournament:num_selections=512,tournament_size=3"
description = "Gallagher 21-HI function with MalthusJAX tournament selection (pop=1024)"

[pipelines.gallagher_21_hi_evosax_simplega]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Gallagher 21-HI function with EvoSAX SimpleGA (pop=1024)"

[pipelines.gallagher_21_hi_evosax_differential_evolution]
fitness = "bbob:fn_name=gallagher_21_hi,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Gallagher 21-HI function with EvoSAX DifferentialEvolution (pop=1024)"
