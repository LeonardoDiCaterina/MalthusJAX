[experiment]
name = "sphere_optimization"
description = "Benchmark crossover and mutation strategies on the sphere function"
output_dir = "results/sphere_optimization"

[experiment.shared]
fitness = "sphere:dim=25"
selection = "tournament:num_selections=30,tournament_size=3"
pop_size = 100
generations = 200
seeds = [42, 43, 44, 45, 46]
genome_type = "real"
genome_length = 25
bounds = [-5.0, 5.0]
maximize = false
elitism = 2

# Pipeline 1: Uniform Crossover + Gaussian Mutation
# Basic strategy, tunable mutation strength decay
[pipelines.uniform_gaussian_constant]
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
mutation_schedule = "constant"
description = "Uniform crossover with constant gaussian mutation"

# Pipeline 2: Uniform Crossover + Gaussian with Linear Decay
# Adaptive strategy: stronger exploration early, exploitation late
[pipelines.uniform_gaussian_linear]
crossover = "uniform_real"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
mutation_schedule = "linear_decay"
description = "Uniform crossover with linearly decaying mutation"

# Pipeline 3: Blend Crossover + Gaussian
# Blend provides smooth interpolation, good for continuous domains
[pipelines.blend_gaussian]
crossover = "blend:alpha=0.5"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
mutation_schedule = "linear_decay"
description = "Blend crossover (α=0.5) with decaying gaussian mutation"

# Pipeline 4: Blend Crossover + Polynomial Mutation
# Polynomial mutation from NSGA-II literature
[pipelines.blend_polynomial]
crossover = "blend:alpha=0.5"
mutation = "polynomial:mutation_rate=0.1,eta=20"
mutation_schedule = "linear_decay"
description = "Blend crossover with polynomial mutation (η=20)"

# Pipeline 5: SBX Crossover + Polynomial Mutation
# Simulated Binary Crossover: NSGA-II benchmark pairing
[pipelines.sbx_polynomial_constant]
crossover = "simulated_binary:eta=20"
mutation = "polynomial:mutation_rate=0.1,eta=20"
mutation_schedule = "constant"
description = "SBX (η=20) + Polynomial mutation—NSGA-II benchmark"

# Pipeline 6: SBX Crossover + Gaussian Mutation
# Exploring alternative mutation with standard crossover
[pipelines.sbx_gaussian]
crossover = "simulated_binary:eta=20"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
mutation_schedule = "linear_decay"
description = "SBX crossover with gaussian mutation"

# Pipeline 7: Binomial Crossover + Gaussian
# Differential Evolution-style crossover
[pipelines.binomial_gaussian]
crossover = "binomial:cr=0.7"
mutation = "gaussian:mutation_rate=0.5,mutation_strength=0.1"
mutation_schedule = "cosine_anneal"
description = "Binomial (CR=0.7) crossover with cosine-annealed mutation"
