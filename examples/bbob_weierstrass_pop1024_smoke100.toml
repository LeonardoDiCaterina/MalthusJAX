# Smoke test for artifact generation on Weierstrass (pop=1024)
# Reduced workload: 100 generations, 3 seeds

[experiment]
name = "BBOB Weierstrass Smoke (pop=1024, gen=100)"
description = "Smoke test for TOML run + artifact generation"
output_dir = "results/bbob_weierstrass_pop1024_smoke100"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 100
seeds = 3

[pipelines.weierstrass_malthusjax_default]
fitness = "bbob:fn_name=weierstrass,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Smoke default MalthusJAX"

[pipelines.weierstrass_evosax_simplega]
fitness = "bbob:fn_name=weierstrass,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Smoke EvoSAX SimpleGA"
