[experiment]
name        = "knapsack_0_1"
description = "0/1 Knapsack problem: benchmark binary operators and selection strategies"
output_dir  = "results/knapsack"

[experiment.shared]
# Problem definition
genome_type  = "binary"
maximize     = true

# Population and evolution (defaults; overridden per pipeline)
pop_size     = 60
generations  = 200
elitism      = 2

# Fixed operators
selection    = "tournament:num_selections=30,tournament_size=3"
crossover    = "uniform_binary"

# Metadata
seeds        = [42, 43, 44, 45, 46]

# --- Data Sources (Synthetic Items) ---

[data.items_50]
source = "synthetic"
num_items = 50
capacity = 500
weight_range = [10, 50]
value_range = [30, 150]
random_seed = 42
description = "50-item knapsack, capacity 500"

[data.items_100]
source = "synthetic"
num_items = 100
capacity = 1000
weight_range = [15, 60]
value_range = [40, 200]
random_seed = 42
description = "100-item knapsack, capacity 1000"

[data.items_200]
source = "synthetic"
num_items = 200
capacity = 2000
weight_range = [20, 80]
value_range = [50, 250]
random_seed = 42
description = "200-item knapsack, capacity 2000"

# --- Pipelines: Small Problem (50 items) ---

# Pipeline 1: Conservative exploration
# Small populations, low mutation for discrete binary space
[pipelines.kp50_low_mutation]
fitness = "knapsack:data_id=items_50"
pop_size = 60
generations = 200
selection = "tournament:num_selections=30,tournament_size=3"
crossover = "uniform_binary"
mutation = "bitflip:mutation_rate=0.02"
description = "50-item: conservative, low mutation (2%)"

# Pipeline 2: Balanced approach
# Medium mutation rate for exploration
[pipelines.kp50_balanced]
fitness = "knapsack:data_id=items_50"
pop_size = 60
generations = 200
selection = "tournament:num_selections=30,tournament_size=3"
crossover = "uniform_binary"
mutation = "bitflip:mutation_rate=0.05"
description = "50-item: balanced mutation (5%)"

# Pipeline 3: Aggressive exploration
# Higher mutation for discovering new item combinations
[pipelines.kp50_high_mutation]
fitness = "knapsack:data_id=items_50"
pop_size = 60
generations = 200
selection = "tournament:num_selections=30,tournament_size=3"
crossover = "single_point"
mutation = "bitflip:mutation_rate=0.10"
description = "50-item: aggressive mutation (10%)"

# Pipeline 4: Single-point crossover + roulette
# Alternative crossover and selection strategy
[pipelines.kp50_single_point_roulette]
fitness = "knapsack:data_id=items_50"
pop_size = 80
generations = 200
selection = "roulette:num_selections=40"
crossover = "single_point"
mutation = "bitflip:mutation_rate=0.05"
description = "50-item: single-point crossover + roulette selection"

# --- Pipelines: Medium Problem (100 items) ---

# Pipeline 5: Medium problem scaling
[pipelines.kp100_balanced]
fitness = "knapsack:data_id=items_100"
pop_size = 120
generations = 300
selection = "tournament:num_selections=60,tournament_size=3"
crossover = "uniform_binary"
mutation = "bitflip:mutation_rate=0.05"
description = "100-item: balanced GA"

# Pipeline 6: Elite pool for binary space
# Maintains best solutions for rapid convergence
[pipelines.kp100_elite_pool]
fitness = "knapsack:data_id=items_100"
pop_size = 120
generations = 300
selection = "elite_pool:num_selections=60,elite_k=12"
crossover = "single_point"
mutation = "bitflip:mutation_rate=0.07"
description = "100-item: elite pool selection"

# --- Pipelines: Large Problem (200 items) ---

# Pipeline 7: Large problem, conservative
# Larger population to maintain diversity
[pipelines.kp200_large_pop]
fitness = "knapsack:data_id=items_200"
pop_size = 200
generations = 400
selection = "tournament:num_selections=100,tournament_size=3"
crossover = "uniform_binary"
mutation = "bitflip:mutation_rate=0.03"
description = "200-item: large population, low mutation"

# Pipeline 8: Large problem, higher mutation
# Trade-off: faster exploration, risk of instability
[pipelines.kp200_adaptive_mutation]
fitness = "knapsack:data_id=items_200"
pop_size = 200
generations = 400
selection = "tournament:num_selections=100,tournament_size=4"
crossover = "uniform_binary"
mutation = "bitflip:mutation_rate=0.05"
description = "200-item: adaptive tournament + balanced mutation"
