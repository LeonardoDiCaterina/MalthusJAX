# BBOB Backend Comparison Experiment - Katsuura Function (Population Size 1024)
# Tests katsuura function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Katsuura (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on katsuura function"
output_dir = "results/bbob_katsuura_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.katsuura_malthusjax_default]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Katsuura function with MalthusJAX default operators (pop=1024)"

[pipelines.katsuura_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Katsuura function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.katsuura_malthusjax_roulette]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "roulette:num_selections=512,temperature=1.0"
description = "Katsuura function with MalthusJAX roulette selection (pop=1024)"

[pipelines.katsuura_malthusjax_tournament]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "tournament:num_selections=512,tournament_size=3"
description = "Katsuura function with MalthusJAX tournament selection (pop=1024)"

[pipelines.katsuura_evosax_simplega]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Katsuura function with EvoSAX SimpleGA (pop=1024)"

[pipelines.katsuura_evosax_differential_evolution]
fitness = "bbob:fn_name=katsuura,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Katsuura function with EvoSAX DifferentialEvolution (pop=1024)"
