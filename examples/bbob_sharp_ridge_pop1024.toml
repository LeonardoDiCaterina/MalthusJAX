# BBOB Backend Comparison Experiment - Sharp Ridge Function (Population Size 1024)
# Tests sharp_ridge function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Sharp Ridge (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on sharp_ridge function"
output_dir = "results/bbob_sharp_ridge_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.sharp_ridge_malthusjax_default]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Sharp Ridge function with MalthusJAX default operators (pop=1024)"

[pipelines.sharp_ridge_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Sharp Ridge function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.sharp_ridge_malthusjax_roulette]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Sharp Ridge function with MalthusJAX roulette selection (pop=1024)"

[pipelines.sharp_ridge_malthusjax_tournament]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Sharp Ridge function with MalthusJAX tournament selection (pop=1024)"

[pipelines.sharp_ridge_evosax_simplega]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Sharp Ridge function with EvoSAX SimpleGA (pop=1024)"

[pipelines.sharp_ridge_evosax_differential_evolution]
fitness = "bbob:fn_name=sharp_ridge,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Sharp Ridge function with EvoSAX DifferentialEvolution (pop=1024)"
