# BBOB Backend Comparison Experiment - Griewank Rosenbrock Function (Population Size 1024)
# Tests griewank_rosenbrock function across 6 backend configurations
# Configuration: real genome (dim=50), 500 generations, 100 seeds, pop_size=1024

[experiment]
name = "BBOB Griewank Rosenbrock (pop=1024)"
description = "Comprehensive comparison of MalthusJAX and EvoSAX backends on griewank_rosenbrock function"
output_dir = "results/bbob_griewank_rosenbrock_pop1024"

[experiment.shared]
genome_type = "real"
genome_length = 50
bounds = [0.0, 1.0]
generations = 500
seeds = 100

[pipelines.griewank_rosenbrock_malthusjax_default]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "malthusjax"
description = "Griewank Rosenbrock function with MalthusJAX default operators (pop=1024)"

[pipelines.griewank_rosenbrock_malthusjax_default_evosaxops]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "malthusjax"
crossover = "evosax_uniform_crossover"
mutation = "evosax_gaussian"
description = "Griewank Rosenbrock function with MalthusJAX + EvoSAX operators (pop=1024)"

[pipelines.griewank_rosenbrock_malthusjax_roulette]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Griewank Rosenbrock function with MalthusJAX roulette selection (pop=1024)"

[pipelines.griewank_rosenbrock_malthusjax_tournament]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "malthusjax"
selection = "elite_pool:num_selections=512,elite_k=512"
description = "Griewank Rosenbrock function with MalthusJAX tournament selection (pop=1024)"

[pipelines.griewank_rosenbrock_evosax_simplega]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "SimpleGA"
description = "Griewank Rosenbrock function with EvoSAX SimpleGA (pop=1024)"

[pipelines.griewank_rosenbrock_evosax_differential_evolution]
fitness = "bbob:fn_name=griewank_rosenbrock,num_dims=50,maximize=false"
backend = "evosax"
evosax_strategy = "DifferentialEvolution"
description = "Griewank Rosenbrock function with EvoSAX DifferentialEvolution (pop=1024)"
