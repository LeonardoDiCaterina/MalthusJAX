name: Package Build & Distribution Validation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/package.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Validate Distribution (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Strict package metadata check with twine
        run: |
          twine check --strict dist/*

      - name: Install generated wheel
        run: |
          python -m pip install dist/*.whl

      - name: Verify CLI entry points and package import
        run: |
          python -c "import malthusjax; print('MalthusJAX Version:', malthusjax.__version__)"
          mjax --help
          mjax check-env

      - name: Upload distribution artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: malthusjax-dist
          path: dist/
          retention-days: 14
