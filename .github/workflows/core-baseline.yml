name: Core Baseline Tests

on:
  pull_request:
    paths:
      - 'src/malthusjax/core/**'
      - 'tests/core/**'
      - '.github/workflows/core-baseline.yml'
  workflow_dispatch:
  push:
    branches:
      - 'refactor/level1-core'

jobs:
  baseline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run baseline script
        run: |
          bash scripts/run_core_baseline.sh

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-baseline-report
          path: tmp/core_baseline_*.log
          retention-days: 30
