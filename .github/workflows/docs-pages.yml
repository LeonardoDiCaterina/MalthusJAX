name: Build & Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'scripts/check_public_docs.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-public-docs:
    name: Check release documentation
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_docs.py
      - run: python -m pip install '.[docs,cpu]'
      - name: Build HTML and check release navigation warnings
        run: |
          python -m sphinx -b html -w "$RUNNER_TEMP/docs-warnings.log" docs/source docs/_build/html
          if grep -E 'docs/source/(index\.rst|quickstart\.md|research_workflows\.md|toml_guide\.md|extension_cli_guide\.md):.*(WARNING|ERROR)' "$RUNNER_TEMP/docs-warnings.log"; then
            exit 1
          fi

  build-and-deploy:
    if: github.event_name != 'pull_request'
    name: Build documentation and deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,cpu,all-integrations,dev]"

      - name: Build docs
        run: |
          python -m sphinx -b html docs/source docs/_build/html



      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          # If you want the site to be served from the root URL (https://<org>.github.io/<repo>), use this.
          # If you want the site at https://<org>.github.io (user site), set publish_branch: gh-pages on that repo.
          publish_branch: gh-pages
          # Keep the published history for easy rollback
          keep_files: true
